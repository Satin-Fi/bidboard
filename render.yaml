# Render.com web service config for the Bidboard API.
# Build command: npm install --prefix server && npm run build --prefix server
# Actually the server needs no build; Render runs `npm start` in /server.
services:
  - type: web
    name: bidboard-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bidboard.com
      - key: AUTO_SEED
        value: "true"
